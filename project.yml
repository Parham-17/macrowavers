# XcodeGen spec. The .xcodeproj is generated from this file and is NOT committed.
# Edit this file, run `make generate`, commit the change. See docs/decisions/0002-xcodegen.md.
name: Macrowavers

options:
  bundleIdPrefix: com.arte1
  deploymentTarget:
    visionOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  indentWidth: 4
  tabWidth: 4
  usesTabs: false
  disabledValidations:
    - missingConfigFiles   # Configs/Local.xcconfig is per-developer and gitignored

configs:
  Debug: debug
  Release: release

# Per-developer overrides (signing team, extra flags). Copied from Configs/Local.xcconfig.example by `make bootstrap`.
configFiles:
  Debug: Configs/Local.xcconfig
  Release: Configs/Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES

targets:
  Macrowavers:
    type: application
    platform: visionOS
    sources:
      - path: Sources/Macrowavers
        excludes:
          - "Resources/**"
      - path: Sources/Macrowavers/Resources
        buildPhase: resources
    info:
      path: Sources/Macrowavers/Info.plist
      properties:
        CFBundleDisplayName: Macrowavers
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        # Add usage descriptions when a feature needs them, for example:
        # NSHandsTrackingUsageDescription: Hand tracking steers the ship.
        # NSWorldSensingUsageDescription: World sensing places the sun on your table.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arte1.macrowavers
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    scheme:
      testTargets:
        - MacrowaversTests
      gatherCoverageData: true

  MacrowaversTests:
    type: bundle.unit-test
    platform: visionOS
    sources:
      - path: Tests/MacrowaversTests
    dependencies:
      - target: Macrowavers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arte1.macrowavers.tests
        GENERATE_INFOPLIST_FILE: YES
